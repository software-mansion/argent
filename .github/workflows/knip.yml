name: Dead Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Match the other tooling jobs (ESLint 10 needs a modern Node).
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      # Knip analyzes source directly (it maps each package's dist entry back to
      # src), so no workspace build is required.
      - name: Knip
        run: npm run knip
