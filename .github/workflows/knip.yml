name: Dead Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Matches what lint, lockfile and repo-hygiene pin; the other eight PR
          # workflows are on 20, e2e-device-smoke by inheriting the
          # start-tool-server composite action's default. knip's own floor,
          # engines.node >=18.18.0, is below both.
          node-version: "24"

      # Knip reads package.json and source only, so every install script here is
      # pure cost to it. Six packages compile on install, and the four that are
      # not optionalDependencies — the three tree-sitter ones and the
      # http3-quiche transport — are a compile failure `npm ci` cannot shrug
      # off, on code this job never touches.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Knip analyzes source directly (it maps each package's dist entry back to
      # src), so no workspace build is required. `npm run knip` reports the
      # enforced classes on their own and only reaches the parked exports/types
      # backlog once that pass is clean, so a failure never lands underneath it.
      - name: Knip
        id: knip
        run: npm run knip

      # Three of knip's four failure shapes name what to remove. The fourth — a
      # breach of the second pass's ceiling — exits 1 with no message at all,
      # under 200+ parked findings that all look alike. This fires on any knip
      # failure, so it has to read correctly for both.
      - name: Explain the failure
        if: failure() && steps.knip.outcome == 'failure'
        run: |
          echo "::error::Dead Code failed. A report naming files, dependencies, binaries or configuration hints comes from the first pass and says what to remove. A report of only \"Unused exports\" / \"Unused exported types\" / \"Unused exported class members\" is the second pass exceeding the --max-issues ceiling in package.json, which knip exits on silently; knip.jsonc explains that ceiling and why it must be counted against a tree with no build output."
