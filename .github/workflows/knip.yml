name: Dead Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # 24 is what the other repo-wide checks pin (lint, lockfile,
          # repo-hygiene); knip's own floor, engines.node >=18.18.0, is well
          # below it.
          node-version: "24"

      # Knip reads package.json and source only, so the native postinstalls in
      # this tree (tree-sitter, protobufjs, the http3-quiche transport, esbuild)
      # are pure cost and a compile-failure surface it never touches.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Knip analyzes source directly (it maps each package's dist entry back to
      # src), so no workspace build is required. `npm run knip` reports the
      # enforced classes on their own and only reaches the parked exports/types
      # backlog once that pass is clean, so a failure never lands underneath it.
      - name: Knip
        run: npm run knip
