name: Dead Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Matches what lint, lockfile and repo-hygiene pin.
          node-version: "24"

      # Knip reads manifests and source only, so install scripts are pure cost
      # here — and skipping them keeps the job immune to a bump that ships no
      # prebuild for the runner, the case dependabot.yml holds tree-sitter back
      # from, where the compile breaks `npm ci` outright.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Knip reads source directly (mapping each package's dist entry back to
      # src), so no workspace build is required. The first pass reports the
      # enforced classes on their own, keeping a real failure from landing
      # underneath the parked backlog.
      - name: Knip
        id: knip
        run: npm run knip

      # A ceiling breach announces nothing — knip just exits 1 under parked
      # findings that name files and symbols exactly like a real one. Section
      # headers are the only thing that tells the two apart.
      - name: Explain the failure
        if: failure() && steps.knip.outcome == 'failure'
        run: |
          echo "::error::Dead Code failed. If the only sections above are the parked ones — unused exports, unused exported types, unused exported class members, or either of their in-used-namespace variants — the second pass exceeded the --max-issues ceiling in package.json, and knip exits on that silently; knip.jsonc explains the ceiling and why it must be counted against a tree with no build output. Any other section is a first-pass finding, and names what to change."
