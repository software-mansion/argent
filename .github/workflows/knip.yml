name: Dead Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Matches what lint, lockfile and repo-hygiene pin; the other eight PR
          # workflows are on 20, e2e-device-smoke by inheriting the
          # start-tool-server composite action's default. knip's own floor,
          # engines.node >=18.18.0, is below both.
          node-version: "24"

      # Knip reads package.json and source only, so every install script here is
      # pure cost to it. Seven are native, and fsevents is darwin-only, so six
      # reach this runner: five try a prebuilt binary before compiling, and
      # dtrace-provider always runs node-gyp but ends in
      # `|| node suppress-error.js`. On this runner only node-pty and
      # dtrace-provider reach a compiler at all, and both are
      # optionalDependencies npm lets fail. What skipping the scripts really
      # buys is immunity to a bump that leaves a package with no prebuild for
      # the runner — the case dependabot.yml holds tree-sitter's minor and major
      # updates back from, where the compile breaks `npm ci` outright.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Knip analyzes source directly (it maps each package's dist entry back to
      # src), so no workspace build is required. `npm run knip` reports the
      # enforced classes on their own and only reaches the parked exports/types
      # backlog once that pass is clean, so a failure never lands underneath it.
      - name: Knip
        id: knip
        run: npm run knip

      # Every first-pass finding names the file or specifier at fault. A breach
      # of the second pass's ceiling names nothing — knip just exits 1, under
      # 200+ parked findings that all look alike. This fires on any knip
      # failure, so it has to read correctly for both.
      - name: Explain the failure
        if: failure() && steps.knip.outcome == 'failure'
        run: |
          echo "::error::Dead Code failed. Any report that names a file, specifier or symbol comes from the first pass and points at what to change. A report of only \"Unused exports\" / \"Unused exported types\" / \"Unused exported class members\" is the second pass exceeding the --max-issues ceiling in package.json, which knip exits on silently; knip.jsonc explains that ceiling and why it must be counted against a tree with no build output."
