name: Dead Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  knip:
    name: Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Matches what lint, lockfile and repo-hygiene pin; the repo's other
          # seven PR workflows are on 20. knip's own floor, engines.node
          # >=18.18.0, is below both.
          node-version: "24"

      # Knip reads package.json and source only, so every install script here is
      # pure cost to it. Six packages compile on install, and the four that are
      # not optionalDependencies — the three tree-sitter ones and the
      # http3-quiche transport — are a compile failure `npm ci` cannot shrug
      # off, on code this job never touches.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Knip analyzes source directly (it maps each package's dist entry back to
      # src), so no workspace build is required. `npm run knip` reports the
      # enforced classes on their own and only reaches the parked exports/types
      # backlog once that pass is clean, so a failure never lands underneath it.
      - name: Knip
        id: knip
        run: npm run knip

      # A ceiling breach is the one failure knip does not announce: it exits 1
      # with no message, under 200+ lines of parked findings that all look the
      # same. Name the ceiling and where it lives, at the end of the log.
      - name: Explain a ceiling failure
        if: failure() && steps.knip.outcome == 'failure'
        run: |
          echo "::error::Dead Code failed. If the output above is only \"Unused exports\" / \"Unused exported types\" / \"Unused exported class members\", the second knip pass went over the --max-issues ceiling in package.json — a new unused export, exported type or class member. knip.jsonc explains why the ceiling is what it is, and why it must be counted against a tree with no build output."
