name: Lockfile

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Supersede a PR's in-flight run rather than let it hold a runner for a verdict
# nobody wants. A push to main keeps its run: that is the commit's only record.
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile-sync:
    name: bun.lock in sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify each bun.lock is in sync with its package.json
        run: |
          status=0
          for dir in . packages/docs packages/tool-server/test/fixtures/electron-smoke-app; do
            (cd "$dir" && bun install --lockfile-only)
            if ! git diff --exit-code -- "$dir/bun.lock"; then
              echo "::error::$dir/bun.lock is out of sync. Run 'bun install' in $dir and commit the updated bun.lock."
              status=1
            fi
          done
          exit "$status"

  # Branch protection requires a check named "package-lock.json in sync"; this
  # reports bun.lock's result under that name. `always()` keeps it from being
  # skipped when that fails, since a skipped required check counts as passed.
  lockfile-sync-result:
    name: package-lock.json in sync
    needs: lockfile-sync
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require bun.lock to be in sync
        run: test "${{ needs.lockfile-sync.result }}" = success
