name: Lockfile

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Supersede a PR's in-flight run rather than let it hold a runner for a verdict
# nobody wants. A push to main keeps its run: that is the commit's only record.
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile-sync:
    name: bun.lock in sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Verify bun.lock is in sync with package.json
        run: |
          bun install --lockfile-only
          if ! git diff --exit-code -- bun.lock; then
            echo "::error::bun.lock is out of sync. Run 'bun install' locally and commit the updated bun.lock."
            exit 1
          fi
