name: Docs build

on:
  push:
    branches:
      - main
    paths:
      - "packages/docs/**"
      - ".github/workflows/docs-build.yml"
      - ".github/workflows/docs-publish.yml"
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select Docs build paths
    uses: ./.github/workflows/pr-check-paths.yml
    with:
      paths: |-
        packages/docs/**
        .github/workflows/docs-build.yml
        .github/workflows/docs-publish.yml

  # Formatting and linting run from the repo root: the Format workflow
  # (.github/workflows/format.yml) and the Lint workflow
  # (.github/workflows/lint.yml) both cover packages/docs.
  docs-build:
    name: Build
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs

    steps:
      - name: Check path selection
        if: needs.changes.result != 'success' || needs.changes.outputs.relevant != 'true'
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          test '${{ needs.changes.result }}:${{ needs.changes.outputs.relevant }}' = 'success:false'
          echo "No matching files changed."

      - name: Checkout
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: needs.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        if: needs.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # packages/docs is excluded from the root workspaces and carries its
      # own lockfile, so it installs on its own.
      - name: Install dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: needs.changes.outputs.relevant == 'true'
        run: bun run typecheck

      # Docusaurus is configured with onBrokenLinks/onBrokenAnchors: "throw",
      # so the build is what catches links left dangling by a moved page.
      - name: Build
        if: needs.changes.outputs.relevant == 'true'
        run: bun run build
