name: Device E2E smoke

# Boot-and-drive smoke tests for every (target × host) cell of the support
# matrix that CI runners can host. Each job boots ONE device through
# the tool-server and asserts the headless interaction pipeline end-to-end via
# scripts/e2e/drive-device.sh: booted:true → screenshot has real pixels →
# gesture-tap round-trips.
#
#   ┌────────────────────┬───────────────┬──────────────────────────────────┐
#   │ target             │ host          │ where                            │
#   ├────────────────────┼───────────────┼──────────────────────────────────┤
#   │ Android emulator   │ Linux (KVM)   │ wayland-e2e.yml (separate file:  │
#   │                    │               │ also asserts gpu.mode=swiftshader)│
#   │ iOS simulator      │ macOS         │ ios-sim-macos (this file)        │
#   │ Chromium / Electron│ Linux (Xvfb)  │ chromium-linux (this file)       │
#   │ Chromium / Electron│ macOS         │ chromium-macos (this file)       │
#   └────────────────────┴───────────────┴──────────────────────────────────┘
#
# KNOWN GAPS — cells Argent supports on real machines but that CI runners
# can't run, so they are intentionally not jobs here:
#   - Android emulator on macOS: the arm64 emulator needs HVF (`-enable-hvf`),
#     but the macOS runners (GitHub-hosted and our tart ones) are VMs with no
#     nested virtualization — qemu dies with "HVF error: HV_UNSUPPORTED"
#     seconds into boot. The Android boot/screenshot/tap path is already
#     regression-guarded on Linux via KVM (wayland-e2e.yml), so macOS adds no
#     runnable coverage here.
#   - Physical devices: real iOS (CoreDevice HID) and real Android (adb-USB)
#     have no attached hardware on CI runners.
#   Both would need a bare-metal Mac runner (HVF / wired-up devices).
#
# Reserve the macOS runners for manual runs and PRs touching the paths below.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same ref: rapid pushes to a PR would otherwise
# stack up the slow macOS jobs (see header) with no cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select Device E2E smoke paths
    uses: ./.github/workflows/pr-check-paths.yml
    with:
      # Cover the transport behind screenshot/gesture-tap (#391), what a Chromium
      # boot runs through, and the test harness.
      paths: |-
        packages/tool-server/src/tools/devices/**
        packages/tool-server/src/tools/gesture-tap/**
        packages/tool-server/src/tools/screenshot/**
        packages/tool-server/src/blueprints/simulator-server.ts
        packages/tool-server/src/blueprints/chromium-cdp.ts
        packages/tool-server/src/utils/simulator-client.ts
        packages/tool-server/src/chromium-server/**
        packages/tool-server/src/utils/free-port.ts
        packages/tool-server/src/utils/debugger/cdp-client.ts
        packages/tool-server/src/utils/electron-env.ts
        packages/tool-server/src/utils/chromium-discovery.ts
        packages/tool-server/src/utils/device-info.ts
        packages/tool-server/src/utils/process-kill.ts
        packages/tool-server/src/utils/vega-process.ts
        packages/tool-server/test/fixtures/electron-smoke-app/**
        scripts/e2e/drive-device.sh
        .github/workflows/e2e-device-smoke.yml
        .github/actions/start-tool-server/action.yml

  # ── iOS simulator on macOS ────────────────────────────────────────────────
  ios-sim-macos:
    name: macOS + iOS E2E
    needs: changes
    if: ${{ !cancelled() }}
    # Argent's self-hosted tart VMs. Fork PRs get a GitHub-hosted runner so
    # untrusted code stays off them.
    runs-on: ${{ needs.changes.outputs.relevant != 'true' && 'ubuntu-latest' || github.event.pull_request.head.repo.fork && 'macos-latest-xlarge' || fromJSON('["self-hosted","macOS","ARM64","sand"]') }}
    timeout-minutes: 30
    steps:
      - name: Check path selection
        if: needs.changes.result != 'success' || needs.changes.outputs.relevant != 'true'
        shell: bash
        run: |
          test '${{ needs.changes.result }}:${{ needs.changes.outputs.relevant }}' = 'success:false'
          echo "No matching files changed."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant == 'true'

      - uses: ./.github/actions/start-tool-server
        if: needs.changes.outputs.relevant == 'true'

      - name: Download signed native binaries (darwin)
        if: needs.changes.outputs.relevant == 'true'
        # iOS needs the simulator-server (screenshot/gesture-tap backend) AND the
        # dylibs + ax-service: bootIos() only returns booted:true when native-
        # devtools injection does NOT give up (boot-device.ts), so missing dylibs
        # would surface here as a hard failure rather than a silent skip. Only
        # consumed at boot time, so it can run after the server starts — and after
        # start-tool-server has set up Node (download-native-binaries.sh reads the
        # Android manifest version with `node -p`).
        run: |
          bash scripts/download-simulator-server.sh
          bash scripts/download-native-binaries.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick an available simulator UDID
        if: needs.changes.outputs.relevant == 'true'
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for rt in d for dev in d[rt] if dev.get('isAvailable') and 'iPhone' in dev['name']))")
          echo "Chosen simulator: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Boot + drive
        if: needs.changes.outputs.relevant == 'true'
        run: bash scripts/e2e/drive-device.sh
        env:
          BOOT_JSON: '{"udid":"${{ env.UDID }}"}'
          DEVICE_ID: ${{ env.UDID }}

      - if: always() && needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ios-sim-macos
          path: |
            ${{ runner.temp }}/smoke-shot.png
            ${{ runner.temp }}/smoke-shot.json
            ~/.argent/tool-server.log
          if-no-files-found: warn
          retention-days: 7

  # ── Chromium / Electron on Linux (Xvfb) ───────────────────────────────────
  chromium-linux:
    name: Linux + Chromium E2E
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check path selection
        if: needs.changes.result != 'success' || needs.changes.outputs.relevant != 'true'
        shell: bash
        run: |
          test '${{ needs.changes.result }}:${{ needs.changes.outputs.relevant }}' = 'success:false'
          echo "No matching files changed."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant == 'true'

      - name: Start Xvfb
        if: needs.changes.outputs.relevant == 'true'
        # boot-electron spawns the Electron child inheriting the tool-server's
        # env, so DISPLAY must be set (in GITHUB_ENV) BEFORE the tool-server
        # starts in the start-tool-server action below.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb
          Xvfb :99 -screen 0 1280x1024x24 >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - uses: ./.github/actions/start-tool-server
        if: needs.changes.outputs.relevant == 'true'

      - name: Vendor the fixture's electron
        if: needs.changes.outputs.relevant == 'true'
        # The fixture brings its own electron;
        # boot-electron resolves ./node_modules/.bin/electron from the app dir.
        # Standalone project (not a packages/* workspace member), so this
        # install is independent of the root install. Electron is only needed at
        # boot time, so vendoring it after the server starts is fine.
        run: bun install --frozen-lockfile
        working-directory: packages/tool-server/test/fixtures/electron-smoke-app

      - name: Boot + drive
        if: needs.changes.outputs.relevant == 'true'
        run: bash scripts/e2e/drive-device.sh
        env:
          BOOT_JSON: '{"electronAppPath":"${{ github.workspace }}/packages/tool-server/test/fixtures/electron-smoke-app","electronPort":19222,"electronArgs":["--no-sandbox"]}'
          DEVICE_ID: chromium-cdp-19222

      - name: Boot + drive the runner's Chrome
        if: needs.changes.outputs.relevant == 'true'
        # The runner image ships Google Chrome on PATH. The start URL paints a
        # gradient so the screenshot clears the blank-framebuffer floor.
        run: bash scripts/e2e/drive-device.sh
        env:
          BOOT_JSON: '{"browser":"chrome","electronPort":19223,"electronArgs":["--no-sandbox","data:text/html,<body style=margin:0;height:100vh;background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red)>"]}'
          DEVICE_ID: chromium-cdp-19223
          ARTIFACT_DIR: ${{ runner.temp }}/browser

      - if: always() && needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-chromium-linux
          path: |
            ${{ runner.temp }}/smoke-shot.png
            ${{ runner.temp }}/smoke-shot.json
            ${{ runner.temp }}/browser/smoke-shot.png
            ${{ runner.temp }}/browser/smoke-shot.json
            /tmp/xvfb.log
            ~/.argent/tool-server.log
          if-no-files-found: warn
          retention-days: 7

  # ── Chromium / Electron on macOS ──────────────────────────────────────────
  chromium-macos:
    name: macOS + Chromium E2E
    needs: changes
    if: ${{ !cancelled() }}
    # Same runner choice as ios-sim-macos.
    runs-on: ${{ needs.changes.outputs.relevant != 'true' && 'ubuntu-latest' || github.event.pull_request.head.repo.fork && 'macos-latest-xlarge' || fromJSON('["self-hosted","macOS","ARM64","sand"]') }}
    timeout-minutes: 20
    steps:
      - name: Check path selection
        if: needs.changes.result != 'success' || needs.changes.outputs.relevant != 'true'
        shell: bash
        run: |
          test '${{ needs.changes.result }}:${{ needs.changes.outputs.relevant }}' = 'success:false'
          echo "No matching files changed."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant == 'true'

      - uses: ./.github/actions/start-tool-server
        if: needs.changes.outputs.relevant == 'true'

      - name: Vendor the fixture's electron
        if: needs.changes.outputs.relevant == 'true'
        run: bun install --frozen-lockfile
        working-directory: packages/tool-server/test/fixtures/electron-smoke-app

      - name: Boot + drive
        if: needs.changes.outputs.relevant == 'true'
        # macOS runner has a window server and Electron's sandbox is fine there,
        # so no Xvfb and no --no-sandbox.
        run: bash scripts/e2e/drive-device.sh
        env:
          BOOT_JSON: '{"electronAppPath":"${{ github.workspace }}/packages/tool-server/test/fixtures/electron-smoke-app","electronPort":19222}'
          DEVICE_ID: chromium-cdp-19222

      - name: Install Chrome
        if: needs.changes.outputs.relevant == 'true'
        # The hosted image ships it; the self-hosted VMs do not.
        run: |
          [ -d "/Applications/Google Chrome.app" ] || brew install --cask google-chrome

      - name: Boot + drive the runner's Chrome
        if: needs.changes.outputs.relevant == 'true'
        # Same start URL as on Linux; the /Applications lookup is macOS-only.
        run: bash scripts/e2e/drive-device.sh
        env:
          BOOT_JSON: '{"browser":"chrome","electronPort":19223,"electronArgs":["data:text/html,<body style=margin:0;height:100vh;background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red)>"]}'
          DEVICE_ID: chromium-cdp-19223
          ARTIFACT_DIR: ${{ runner.temp }}/browser

      - if: always() && needs.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-chromium-macos
          path: |
            ${{ runner.temp }}/smoke-shot.png
            ${{ runner.temp }}/smoke-shot.json
            ${{ runner.temp }}/browser/smoke-shot.png
            ${{ runner.temp }}/browser/smoke-shot.json
            ~/.argent/tool-server.log
          if-no-files-found: warn
          retention-days: 7
