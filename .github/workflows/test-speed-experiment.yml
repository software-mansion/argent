name: Test speed experiment

on:
  push:
    branches:
      - ci/test-speedup

jobs:
  stress:
    name: auto-clock stress ${{ matrix.n }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - id: node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - name: Stress the auto-clock files
        shell: bash
        working-directory: packages/tool-server
        run: |
          files=$(grep -rl "useAutoAdvancingClock()" test)
          echo "$files" | wc -l
          fails=0
          for i in $(seq 1 20); do
            for j in a b; do
              (timeout 300 npx vitest run $files --reporter=dot > "out-$i$j.txt" 2>&1; echo "$i$j $?" >> results.txt) &
            done
            wait
          done
          sort results.txt | awk '{print $2}' | sort | uniq -c
          for f in out-*.txt; do grep -q "failed" "$f" && { echo "== $f"; grep -E "FAIL|Error" "$f" | head -20; }; done
          ! grep -qv " 0$" results.txt
