name: Test speed experiment

on:
  push:
    branches:
      - ci/test-speedup

jobs:
  single:
    name: single w=${{ matrix.workers }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workers: [3, 8, 16, 32]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm install @rollup/rollup-linux-x64-gnu --no-save
      - run: npm run build
      - name: Tests
        run: /usr/bin/time -v npx vitest run --maxWorkers=${{ matrix.workers }} --reporter=dot --reporter=json --outputFile.json=report.json 2>&1 | tail -60
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-single-${{ matrix.workers }}
          path: report.json

  sharded:
    name: shard ${{ matrix.shard }}/4 w=16
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm install @rollup/rollup-linux-x64-gnu --no-save
      - run: npm run build
      - name: Tests
        run: /usr/bin/time -v npx vitest run --shard=${{ matrix.shard }}/4 --maxWorkers=16 --reporter=dot --reporter=json --outputFile.json=report.json 2>&1 | tail -60
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-shard-${{ matrix.shard }}
          path: report.json

  typecheck-parallel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Typecheck tests (parallel)
        run: |
          ls -d packages/*/tsconfig.test.json | xargs -P 4 -I{} sh -c 'npx tsc --noEmit -p {} || exit 255'
