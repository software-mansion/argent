name: Test speed experiment

on:
  push:
    branches:
      - ci/test-speedup

jobs:
  sharded:
    name: shard ${{ matrix.shard }}/4 w=${{ matrix.workers }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        workers: ["default", "8"]
    steps:
      - uses: actions/checkout@v7
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - id: node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run build
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          extra=""
          [ "${{ matrix.workers }}" != default ] && extra="--maxWorkers=${{ matrix.workers }}"
          /usr/bin/time -v npm test -- --shard=${{ matrix.shard }}/4 $extra --reporter=default --reporter=json --outputFile.json=report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report-${{ matrix.shard }}-${{ matrix.workers }}
          path: report.json
