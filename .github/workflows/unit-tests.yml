name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Supersede a PR's in-flight run rather than let it hold a runner for a verdict
# nobody wants. A push to main keeps its run: that is the commit's only record.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Node 22 is the oldest line Argent supports.
  unit-tests:
    name: Unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # setup-node caches only the downloads; npm ci still takes 35-75s here.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build

      - name: Run tests
        run: npm test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Test root scripts
        if: matrix.shard == 1
        run: npm run test:scripts

  # Branch protection requires a check named "Unit tests"; this reports the
  # shards' combined result under that name. `always()` keeps it from being
  # skipped when a shard fails, since a skipped required check counts as passed.
  unit-tests-result:
    name: Unit tests
    needs: unit-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every shard to pass
        run: test "${{ needs.unit-tests.result }}" = success

  # Typechecking needs the same install and build as the tests but none of their
  # output, so running it alongside them takes its ~60s off the critical path
  # rather than adding to it.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:tests --workspaces --if-present

      - name: Typecheck scripts
        run: npm run typecheck:scripts
