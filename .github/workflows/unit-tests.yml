name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Supersede a PR's in-flight run rather than let it hold a runner for a verdict
# nobody wants. A push to main keeps its run: that is the commit's only record.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Node 22 is the oldest line Argent supports.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bun run build

      - name: Run tests
        run: bun run --workspaces --sequential --no-exit-on-error --if-present test

      - name: Test root scripts
        run: bun run test:scripts

  # Typechecking needs the same install and build as the tests but none of their
  # output, so running it alongside them takes its ~60s off the critical path
  # rather than adding to it.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bun run build

      - name: Typecheck tests
        run: bun run --workspaces --sequential --no-exit-on-error --if-present typecheck:tests

      - name: Typecheck scripts
        run: bun run typecheck:scripts
