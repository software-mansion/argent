name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Supersede a PR's in-flight run rather than let it hold a runner for a verdict
# nobody wants. A push to main keeps its run: that is the commit's only record.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Fix rollup native bindings
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Build workspace dependencies
        run: npm run build

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Test root scripts
        run: npm run test:scripts

  # A `script:` step runs TypeScript only from Node 22.18, so the job above, on
  # Node 20, skips every test that executes an `.mts` or `.ts` file. This job
  # runs them, on a Node that runs TypeScript.
  #
  # Node 22 and Node 24, because they load a CommonJS `.ts` script differently:
  # behind a preload, 22 gives it a reduced `require` and 24.18 and later do
  # not. The runner covers that gap, and only Node 22 shows if it stops.
  script-steps-typescript:
    name: TypeScript script steps (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Fix rollup native bindings
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Build workspace dependencies
        run: npm run build

      - name: Run the script step tests
        working-directory: packages/tool-server
        run: >-
          npx vitest run
          test/flows/script/flow-script-step-run.test.ts
          test/flows/script/flow-script-typescript.test.ts
          test/flows/script/flow-script-run.test.ts

  # Typechecking needs the same install and build as the tests but none of their
  # output, so running it alongside them takes its ~60s off the critical path
  # rather than adding to it.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:tests --workspaces --if-present

      - name: Typecheck scripts
        run: npm run typecheck:scripts
