name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Supersede a PR's in-flight run rather than let it hold a runner for a verdict
# nobody wants. A push to main keeps its run: that is the commit's only record.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Node 22 is the oldest line Argent supports.
  unit-tests:
    name: Unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      # Saved before the tests run: Vitest writes its transform cache into
      # node_modules, and that cache misses tsconfig changes.
      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Build workspace dependencies
        run: bun run build

      - name: Run tests
        run: bun run test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Test root scripts
        if: matrix.shard == 1
        run: bun run test:scripts

  # Branch protection requires a check named "Unit tests"; this reports the
  # shards' combined result under that name. `!cancelled()` keeps it from being
  # skipped when a shard fails, since a skipped required check counts as passed.
  unit-tests-result:
    name: Unit tests
    needs: unit-tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every shard to pass
        run: test "${{ needs.unit-tests.result }}" = success

  # Typechecking needs the same install and build as the tests but none of their
  # output, so running it alongside them takes its ~60s off the critical path
  # rather than adding to it.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Save node_modules
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.node-modules.outputs.cache-primary-key }}

      - name: Build workspace dependencies
        run: bun run build

      - name: Typecheck tests
        run: bun run --workspaces --sequential --no-exit-on-error --if-present typecheck:tests

      - name: Typecheck scripts
        run: bun run typecheck:scripts
