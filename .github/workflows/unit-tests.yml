name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Supersede a PR's in-flight run rather than let it hold a runner for a verdict
# nobody wants. A push to main keeps its run: that is the commit's only record.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Node 22 is the oldest line Argent supports, and Node 24 is what most users
  # run, so both run every test. The two differ where the tests can see it, for
  # example in how Node loads the script of a `script:` step and how
  # TextDecoder reads windows-1252.
  unit-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22"
            name: Unit tests
          - node: "24"
            name: Unit tests (Node 24)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Fix rollup native bindings
        run: npm install @rollup/rollup-linux-x64-gnu --no-save

      - name: Build workspace dependencies
        run: npm run build

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Test root scripts
        if: matrix.node == '22'
        run: npm run test:scripts

  # Typechecking needs the same install and build as the tests but none of their
  # output, so running it alongside them takes its ~60s off the critical path
  # rather than adding to it.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace dependencies
        run: npm run build

      - name: Typecheck tests
        run: npm run typecheck:tests --workspaces --if-present

      - name: Typecheck scripts
        run: npm run typecheck:scripts
