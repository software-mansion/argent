name: Publish npm package

# One file, because npm trusted publishing registers a single workflow filename
# as the package's trusted publisher.
#
# Modes (derived from the trigger + the ref's version):
#
#   push to main       → canary: version derived + stamped (<base>-next.<k>),
#                        published under the `next` dist-tag. Gated behind the
#                        PUBLISH_NPM_UNIFIED repository variable.
#   push of a v* tag   → release: publishes the tag's package.json version
#   workflow_dispatch    verbatim, on the dist-tag derived from that version,
#                        then creates the tag's GitHub release with the
#                        published tarball attached. Pushing the tag is the
#                        whole release; a dispatch re-runs it for a ref, or
#                        rehearses it with `dry_run`. `dry_run` never exercises
#                        the canary machinery (stamping, --version check,
#                        collision retry).
#
# Trusted publishing: THIS file is registered on npmjs.com as the npm Trusted
# Publisher for @swmansion/argent and for `argent` (the npx alias published by
# the publish-alias job), so the OIDC exchange authenticates the
# publish and no npm token is involved. Renaming or moving it breaks publishing
# until that registration is updated to match. NPM_TOKEN survives as a repo
# secret only for sync-next-tag.yml, which mutates dist-tags — OIDC covers
# publishing only.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to publish (e.g. v0.17.0 or v0.17.0-next.0)"
        required: true
        type: string
      channel:
        description: "Expected dist-tag; 'auto' derives it from the version (prerelease → next, stable → latest), an explicit value makes the run fail on a mismatch"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - latest
          - next
      dry_run:
        description: "Build and verify the bundle, but skip npm publish"
        required: false
        default: false
        type: boolean

concurrency:
  # Serialize canary publishes: the per-base counter is the next index after the
  # highest published `<base>-next.<k>`, so overlapping runs would read the same
  # index and collide on npm. Releases (tag pushes and dispatches) share their
  # own lane, so a dispatch can't race a tag push for the same version, and an
  # in-flight publish is never cancelled.
  group: publish-npm-${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'canary' || 'release' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Unsetting PUBLISH_NPM_UNIFIED is the canary kill-switch; releases always
    # run.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || vars.PUBLISH_NPM_UNIFIED == '1'
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version }}
      # The version that actually went out: a canary's is only known after the
      # publish, which may have restamped it on a collision.
      published_version: ${{ steps.published.outputs.version }}
      dist_tag: ${{ steps.mode.outputs.dist_tag }}
    permissions:
      contents: read
      id-token: write # npm provenance attestation + trusted-publishing OIDC exchange

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@swmansion"

      # Trusted publishing needs npm >= 11.5.1; don't rely on whatever the
      # runner image bundles.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # The ref reaches the script through env, never template interpolation —
      # this file is the trusted publisher, so a crafted ref name must stay data.
      # On a tag push the ref is the tag's name (inputs are empty on a push).
      - name: Resolve publish mode
        id: mode
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          CHANNEL: ${{ inputs.channel || 'auto' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # The newest argent-private main build of the signed binaries
            # (argent-main-<sha>). Resolved once here, so both downloads below
            # read the same release even if a newer build lands mid-run.
            BINARIES_TAG="$(bash scripts/resolve-main-binaries-tag.sh)"
            echo "mode=canary" >> "$GITHUB_OUTPUT"
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            echo "binaries_tag=${BINARIES_TAG}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./packages/argent/package.json').version")
            case "$VERSION" in
              *-*) DERIVED=next ;;
              *)   DERIVED=latest ;;
            esac
            if [ "$CHANNEL" != "auto" ] && [ "$CHANNEL" != "$DERIVED" ]; then
              echo "::error::Version '$VERSION' at ref '$REF' belongs on the '$DERIVED' dist-tag, but channel '$CHANNEL' was requested. Pick the ref matching the channel you meant (or leave channel on 'auto')." >&2
              exit 1
            fi
            # A tag names the version it releases; publishing a different one
            # under it would also give the GitHub release the wrong tarball.
            case "$REF" in
              v*)
                if [ "$REF" != "v${VERSION}" ]; then
                  echo "::error::Tag '$REF' does not match the package.json version '$VERSION'. Bump the version first, or tag the commit that has it." >&2
                  exit 1
                fi
                ;;
            esac
            echo "Resolved version: $VERSION → dist-tag '$DERIVED'"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "dist_tag=$DERIVED" >> "$GITHUB_OUTPUT"
            echo "binaries_tag=argent-${REF//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download signed simulator-server binary
        run: bash scripts/download-simulator-server.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download signed native binaries (dylibs, ax-service, Android helper APK, network inspector agent)
        run: bash scripts/download-native-binaries.sh "$BINARIES_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARIES_TAG: ${{ steps.mode.outputs.binaries_tag }}

      - name: Download Perfetto trace-processor WASM artifacts
        run: bash scripts/download-trace-processor.sh "$BINARIES_TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARIES_TAG: ${{ steps.mode.outputs.binaries_tag }}

      - run: npm ci

      - run: npm run build

      # Sequenced after `npm ci` (the checked-out lockfile still matches the
      # original version at install time) and before the bundle build, which
      # bakes the version into the telemetry payload as a string literal — a
      # build that ran first would stamp every canary's events with the previous
      # release's version.
      - name: Compute and stamp canary version
        if: steps.mode.outputs.mode == 'canary'
        id: canary
        run: |
          VERSION="$(node scripts/next-canary-version.mjs --write)"
          echo "Canary version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: npm run build -w @swmansion/argent
        env:
          # Release-only: build-package-artifact.yml omits it so test tarballs
          # stay inert. An unset secret bakes in an empty token, which disables
          # telemetry rather than failing the build.
          ARGENT_OTEL_INGEST_TOKEN: ${{ secrets.ARGENT_OTEL_INGEST_TOKEN }}

      # darwin is always required; the Linux keys (x86_64 "linux", arm64
      # "linux-arm64") and win32 stay gated until radon's artifacts for them are
      # reliably present — flip the matching env var to "1" then. The inventory
      # always logs every platform so a silently-missing binary shows up in the
      # run.
      - name: Verify per-platform simulator-server binaries
        env:
          ARGENT_REQUIRE_LINUX_BINARY: "0"
          ARGENT_REQUIRE_WINDOWS_BINARY: "0"
        run: |
          set -e
          missing=0
          echo "simulator-server inventory:"
          for plat in darwin linux linux-arm64 win32; do
            bin="simulator-server"
            if [[ "$plat" == "win32" ]]; then bin="simulator-server.exe"; fi
            p="packages/argent/bin/${plat}/${bin}"
            if [[ -x "$p" ]]; then
              size=$(wc -c <"$p")
              echo "  ✓ ${plat}: ${p} (${size} bytes; $(file -b "$p"))"
            else
              echo "  ✗ ${plat}: ${p} — missing"
              if [[ "$plat" == "darwin" ]]; then missing=1; fi
              if [[ "$plat" == linux* && "${ARGENT_REQUIRE_LINUX_BINARY}" == "1" ]]; then missing=1; fi
              if [[ "$plat" == "win32" && "${ARGENT_REQUIRE_WINDOWS_BINARY}" == "1" ]]; then missing=1; fi
            fi
          done
          [[ "$missing" == "0" ]] || { echo "::error::required simulator-server binary missing"; exit 1; }
      - run: test -x packages/argent/bin/darwin/ax-service
      - run: test -f packages/argent/dylibs/libNativeDevtoolsIos.dylib
      - run: test -f packages/argent/dylibs/libKeyboardPatch.dylib
      - run: test -f packages/argent/dylibs/libArgentInjectionBootstrap.dylib
      # TODO: assert libArgentAudio.dylib once an argent-private release ships it.
      # tvOS (Apple TV) binaries — missing ones would silently ship a package
      # whose TV tooling crashes at runtime.
      - run: test -x packages/argent/bin/darwin/tvos-ax-service
      - run: test -x packages/argent/bin/darwin/tvos-hid-daemon
      - run: test -f packages/argent/dylibs/tvos/libNativeDevtoolsIos.dylib
      - run: test -f packages/argent/dylibs/tvos/libKeyboardPatch.dylib
      - run: test -f packages/argent/dylibs/tvos/libArgentInjectionBootstrap.dylib
      # Native Mac app library and launch helper: without them boot-device
      # cannot start a Mac app.
      - run: test -f packages/argent/dylibs/macos/libNativeDevtoolsMacos.dylib
      - run: test -f packages/argent/dylibs/macos/libArgentInjectionBootstrap.dylib
      - run: test -x packages/argent/bin/darwin/argent-macos-helper
      # TCP-transport (sim-remote / ios-remote) binaries — the ax-service and
      # native-devtools variants the remote code path spawns/injects over a
      # sim-remote-tunnelled TCP socket. bin/tcp is platform-NEUTRAL:
      # axServiceBinaryPathTcp() resolves bin/tcp on every host, never a
      # bin/<platform>/tcp subdir.
      - run: test -x packages/argent/bin/tcp/ax-service
      - run: test -f packages/argent/dylibs/tcp/libNativeDevtoolsIos.dylib
      - run: test -f packages/argent/dylibs/tcp/libKeyboardPatch.dylib
      - run: test -f packages/argent/dylibs/tcp/libArgentInjectionBootstrap.dylib
      - run: test -f packages/argent/dist/ios-device-runner/ArgentRunner/ArgentRunner.xcodeproj/project.pbxproj
      - run: test -f packages/argent/dist/ios-device-runner/ArgentRunner/ArgentRunner.xcodeproj/xcshareddata/xcschemes/ArgentRunner.xcscheme
      - run: test -f packages/argent/dist/ios-device-runner/ArgentRunner/ArgentRunnerUITests/ArgentRunnerSession.swift
      - run: test -f packages/argent/assets/argent.tracecfg.pbtxt
      - run: test -d packages/argent/assets/queries
      - run: test -f packages/argent/assets/manifest.json
      - run: test -f packages/argent/assets/trace-processor/trace_processor.wasm
      - run: test -f packages/argent/assets/trace-processor/engine_bundle.node.js
      - run: test ! -e packages/argent/assets/trace-processor/engine.mjs
      - run: test -f packages/argent/assets/trace-processor/LICENSE
      - run: head -c4 packages/argent/assets/trace-processor/trace_processor.wasm | grep -q $'\x00asm'
      - run: ls packages/argent/bin/argent-android-devtools-*.apk
      - run: test -f packages/argent/bin/network-inspector/network-inspector.jar
      - run: test -f packages/argent/bin/network-inspector/x86_64/libjvmti_network_inspector.so
      - run: test -f packages/argent/bin/network-inspector/arm64-v8a/libjvmti_network_inspector.so
      # Flow `script` runner + watchdogs, flat in dist/ beside tool-server.cjs.
      # flow-script-executor.ts resolves the runner there via __dirname, and the
      # runner resolves both watchdogs against its own import.meta.url.
      - run: test -f packages/argent/dist/flow-script-runner.mjs
      - run: test -f packages/argent/dist/flow-script-watchdog-lifeline.mjs
      - run: test -f packages/argent/dist/flow-script-watchdog-deadline.mjs

      # The shipped CLI reads its version from package.json at runtime, so this
      # is exactly what `argent --version` prints after install.
      - name: Verify argent --version reports the canary version
        if: steps.mode.outputs.mode == 'canary'
        run: |
          REPORTED="$(node packages/argent/dist/cli.js --version)"
          EXPECTED="${{ steps.canary.outputs.version }}"
          echo "argent --version → ${REPORTED} (expected ${EXPECTED})"
          [ "${REPORTED}" = "${EXPECTED}" ] || { echo "::error::argent --version (${REPORTED}) != published version (${EXPECTED})"; exit 1; }

      # `argent --version` reads package.json at runtime, so it stays correct
      # however the build is sequenced and cannot catch a stale *baked* version.
      # Telemetry's cli_version is substituted into each bundle at build time, so
      # it is only right while the stamp precedes the build — assert the literal
      # every bundle actually carries.
      - name: Verify the bundled telemetry version matches the canary version
        if: steps.mode.outputs.mode == 'canary'
        env:
          EXPECTED: ${{ steps.canary.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const expected = process.env.EXPECTED;
            const dir = "packages/argent/dist";
            // esbuild folds the ARGENT_CLI_VERSION define into readCliVersion.
            const re = /function readCliVersion\(\)\s*\{[^}]*?return\s*"([^"]*)"/s;
            let checked = 0;
            let failed = false;
            for (const file of fs.readdirSync(dir).filter((f) => /\.(mjs|cjs)$/.test(f))) {
              const m = re.exec(fs.readFileSync(path.join(dir, file), "utf8"));
              // Bundles that do not carry telemetry (e.g. mcp-server) bake no version.
              if (!m) continue;
              checked++;
              const ok = m[1] === expected;
              console.log(`${ok ? "ok  " : "FAIL"} ${file}: baked cli_version ${m[1]} (expected ${expected})`);
              if (!ok) failed = true;
            }
            if (checked === 0) {
              console.log(`::error::no bundle in ${dir} bakes a telemetry cli_version — the check can no longer see what ships`);
              process.exit(1);
            }
            if (failed) {
              console.log("::error::bundled telemetry cli_version != published version — the canary stamp must run before the bundle build");
              process.exit(1);
            }
            console.log(`Verified the baked telemetry version in ${checked} bundle(s).`);
          '

      - run: npm pack --dry-run -w @swmansion/argent

      - name: Dry run — skipping publish
        if: steps.mode.outputs.mode == 'release' && inputs.dry_run
        run: |
          VERSION=$(node -p "require('./packages/argent/package.json').version")
          echo "dry_run: would have published ${VERSION} under dist-tag '${{ steps.mode.outputs.dist_tag }}'"
          echo "Dry run — **not** published: \`@swmansion/argent@${VERSION}\` (dist-tag \`${{ steps.mode.outputs.dist_tag }}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.mode.outputs.mode == 'release' && !inputs.dry_run
        run: npm publish -w @swmansion/argent --tag "$DIST_TAG" --provenance
        env:
          DIST_TAG: ${{ steps.mode.outputs.dist_tag }}

      # For the github-release job. `npm publish` packs with the same packer
      # (libnpmpack) and packing is deterministic, so this is byte-identical to
      # the tarball npm just received.
      - name: Pack the published tarball
        if: steps.mode.outputs.mode == 'release' && !inputs.dry_run
        run: npm pack -w @swmansion/argent --pack-destination .

      - uses: actions/upload-artifact@v7
        if: steps.mode.outputs.mode == 'release' && !inputs.dry_run
        with:
          name: npm-tarball
          path: swmansion-argent-${{ steps.mode.outputs.version }}.tgz
          if-no-files-found: error

      # Serialization makes concurrent index collisions impossible, but npm's
      # read-after-write lag can still hand a back-to-back run a stale version
      # list, so retry a version-exists collision by recomputing + restamping.
      # npm stages a publish for minutes before listing it, and rejects a
      # second publish of a staged version with E409 while `npm view` still
      # cannot see it, so that counts as a collision too, and --taken makes
      # the recompute step past it. Any other publish failure is real and
      # fails fast.
      - name: Publish canary
        if: steps.mode.outputs.mode == 'canary'
        env:
          DIST_TAG: ${{ steps.mode.outputs.dist_tag }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            VERSION="$(node -p "require('./packages/argent/package.json').version")"
            echo "Publishing ${VERSION} (attempt ${attempt})"
            if npm publish -w @swmansion/argent --tag "$DIST_TAG" --provenance 2>&1 | tee publish.log; then
              echo "Published ${VERSION}"
              exit 0
            fi
            if grep -q "previously staged version" publish.log \
              || npm view "@swmansion/argent@${VERSION}" version >/dev/null 2>&1; then
              echo "::warning::${VERSION} already on npm (lost a race / stale read) — recomputing"
              node scripts/next-canary-version.mjs --write --taken "$VERSION"
              sleep 10
            else
              echo "::error::npm publish failed for ${VERSION} (not a version collision)"
              exit 1
            fi
          done
          echo "::error::canary publish still colliding after 3 attempts"
          exit 1

      - name: Publish summary
        id: published
        if: success() && !(steps.mode.outputs.mode == 'release' && inputs.dry_run)
        run: |
          VERSION=$(node -p "require('./packages/argent/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Published \`@swmansion/argent@${VERSION}\` under dist-tag \`${{ steps.mode.outputs.dist_tag }}\` (with provenance)" >> "$GITHUB_STEP_SUMMARY"

      # `npm publish --tag` already tags this release. Re-pointing `next` at the
      # highest published version (and repairing it if stale) is the
      # "Sync 'next' dist-tag" workflow, which runs automatically once this one
      # succeeds.

  # Publishes `argent`, the alias that makes `npx argent <command>` run
  # @swmansion/argent, at the same version and dist-tag, pinned to the
  # @swmansion/argent release just published. A separate job, so a failure here
  # never holds back the main package or its release tarball; continue-on-error
  # keeps it from failing the run, which sync-next-tag.yml needs to succeed.
  # Re-run this job once the cause is fixed.
  publish-alias:
    needs: publish
    runs-on: ubuntu-latest
    if: needs.publish.outputs.published_version != ''
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # npm provenance attestation + trusted-publishing OIDC exchange

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # The committed manifest carries 0.0.0 placeholders; the alias always
      # mirrors the @swmansion/argent version it runs. Re-running the job after
      # the alias went out is a no-op rather than a version-exists failure.
      - name: Publish the argent alias
        working-directory: packages/argent-alias
        env:
          VERSION: ${{ needs.publish.outputs.published_version }}
          DIST_TAG: ${{ needs.publish.outputs.dist_tag }}
        run: |
          npm pkg set version="$VERSION" "dependencies.@swmansion/argent=$VERSION"
          if npm view "argent@${VERSION}" version >/dev/null 2>&1; then
            echo "argent@${VERSION} is already on npm — nothing to publish"
            exit 0
          fi
          npm publish --tag "$DIST_TAG" --provenance
          echo "Published \`argent@${VERSION}\` (alias for \`@swmansion/argent@${VERSION}\`) under dist-tag \`${DIST_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

  # Creates the GitHub release for the tag, with the published tarball attached
  # so users who don't pull from the npm registry can download it from the
  # release page. The asset is the tarball the publish job packed,
  # byte-identical to the one npm received. A separate job keeps
  # `contents: write` away from the OIDC-privileged publish job. Running after
  # the publish means the release only appears once the package is on npm.
  #
  # The org enforces immutable releases: once a release is published, no asset
  # can be added to it. `gh release create` with a file creates a draft,
  # uploads the file and only then publishes, so the tarball is in before the
  # release locks.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    if: needs.publish.outputs.mode == 'release' && !inputs.dry_run
    # The package is already on npm by now, and sync-next-tag.yml only follows a
    # successful run, so a failed release must not fail the run. Re-run this job
    # once the cause is fixed.
    continue-on-error: true
    permissions:
      contents: write

    steps:
      # The tarball the publish job packed. Not fetched back from npm: a version
      # published seconds ago is not yet visible there (the 0.25.2 attach failed
      # on exactly that), and the packed file already has npm's bytes.
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball

      - name: Create the GitHub release with the tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIST_TAG: ${{ needs.publish.outputs.dist_tag }}
        run: |
          TAG="v${VERSION}"
          ASSET="swmansion-argent-${VERSION}.tgz"
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          # `gh release view` also finds drafts, which the releases/tags API
          # does not return.
          if IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$IS_DRAFT" = "true" ]; then
              # A draft left by an earlier attempt that failed mid-upload.
              gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
              echo "Attached \`${ASSET}\` to the draft release [${TAG}](${URL}) and published it" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Published releases are immutable, so a re-run can only confirm.
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$ASSET"; then
              echo "Release [${TAG}](${URL}) is already published with \`${ASSET}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::${TAG} is already published without ${ASSET}, and published releases are immutable. Mention \`npm pack @swmansion/argent@${VERSION}\` in its release notes instead."
            exit 1
          fi
          # A prerelease (published under `next`) must not become the repo's
          # latest release.
          if [ "$DIST_TAG" = "latest" ]; then
            FLAGS=(--latest)
          else
            FLAGS=(--prerelease --latest=false)
          fi
          # --verify-tag: never let gh create a missing tag on the default
          # branch; a dispatch of a branch or SHA has no release to make.
          if ! gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --generate-notes "${FLAGS[@]}"; then
            echo "::error::could not create the GitHub release for ${TAG}. If the tag doesn't exist, push it; then re-run this job."
            exit 1
          fi
          echo "Created release [${TAG}](${URL}) with \`${ASSET}\`" >> "$GITHUB_STEP_SUMMARY"
